<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Поздравление с днём рождения</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255, 200, 220, 0.15) 0px,
          rgba(255, 200, 220, 0.15) 2px,
          transparent 2px,
          transparent 30px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255, 180, 200, 0.08) 0px,
          rgba(255, 180, 200, 0.08) 1px,
          transparent 1px,
          transparent 15px
        ),
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.55) 0 6%, transparent 7%),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.4) 0 5%, transparent 6%),
        radial-gradient(circle at 30% 80%, rgba(255,255,255,0.35) 0 5%, transparent 6%),
        linear-gradient(135deg, #ffd6e8, #ffe5f0);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(
        ellipse at center,
        transparent 50%,
        rgba(255, 248, 235, 0.4) 75%,
        rgba(255, 240, 220, 0.6) 100%
      );
    }

    .sakura-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .sakura-petal {
      position: absolute;
      top: -30px;
      width: 20px;
      height: 20px;
      background: radial-gradient(ellipse at 30% 30%, #ffb7c5, #ff8fa3);
      border-radius: 50% 0 50% 50%;
      opacity: 0.7;
      animation: sakura-fall linear infinite;
      transform-origin: center;
      filter: drop-shadow(0 0 3px rgba(255, 150, 180, 0.3));
      will-change: transform;
    }

    .sakura-petal::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: rotate(-20deg);
    }

    .sakura-petal:nth-child(odd) {
      border-radius: 0 50% 50% 50%;
    }

    @keyframes sakura-fall {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg) scale(1);
        opacity: 0;
      }
      5% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(110vh) translateX(var(--sway)) rotate(720deg) scale(0.3);
        opacity: 0;
      }
    }

    .main-frame {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 610px;
      height: 610px;
      padding: 40px;
      border: 3px solid rgba(255, 255, 255, 0.5);
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      box-shadow: 
        0 0 40px rgba(255, 79, 141, 0.15),
        inset 0 0 40px rgba(255, 79, 141, 0.05);
      z-index: 5;
      transform: translateY(10px);
      flex-shrink: 0;
    }

    .hearts-border {
      position: absolute;
      top: -3px;
      left: -3px;
      right: -3px;
      bottom: -3px;
      pointer-events: none;
      z-index: 4;
      border-radius: 43px;
    }

    .heart-icon {
      position: absolute;
      font-size: 18px;
      color: rgba(255, 79, 141, 0.6);
      animation: heart-float 3s ease-in-out infinite alternate;
      text-shadow: 0 0 15px rgba(255, 79, 141, 0.3);
      user-select: none;
      transform: translate(-50%, -50%);
    }

    .heart-icon:nth-child(odd) {
      animation-delay: 0.5s;
    }
    .heart-icon:nth-child(3n) {
      animation-delay: 1s;
    }
    .heart-icon:nth-child(5n+2) {
      animation-duration: 4s;
    }

    @keyframes heart-float {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.5;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.15);
        opacity: 0.9;
      }
    }

    .content-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: 0;
      position: relative;
    }

    /* ЦВЕТЫ — на 16px ОТ центра и ВНИЗ */
    .flowers-corner {
      position: absolute;
      z-index: 8;
      pointer-events: none;
      width: 300px;
      height: auto;
      opacity: 0.7;
      filter: drop-shadow(0 0 10px rgba(255, 150, 200, 0.3));
      transition: opacity 0.3s ease;
    }

    .flowers-corner-left {
      left: -30px;
      bottom: -30px;
      transform: rotate(0deg);
    }

    .flowers-corner-right {
      right: -30px;
      bottom: -30px;
      transform: scaleX(-1) rotate(0deg);
    }

    .message-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      position: relative;
      width: 100%;
      margin-bottom: 0;
    }

    .message-container.visible {
      opacity: 1;
    }

    .message-wrapper {
      position: relative;
      display: inline-block;
      width: auto;
      height: auto;
    }

    .message-image {
      max-width: 400px;
      width: 400px;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 30px rgba(255, 79, 141, 0.5));
      border-radius: 15px;
    }

    .message-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow:
        0 0 10px rgba(255, 255, 255, 1),
        0 0 20px rgba(255, 79, 141, 1),
        0 0 40px rgba(255, 79, 141, 1),
        0 0 60px rgba(200, 40, 100, 0.9);
      animation: message-glow 1.8s ease-in-out infinite alternate;
      white-space: nowrap;
      background: transparent !important;
      backdrop-filter: none !important;
      border: none !important;
      padding: 0 !important;
      pointer-events: none;
      user-select: none;
      width: 100%;
      text-align: center;
    }

    @keyframes message-glow {
      0% {
        text-shadow:
          0 0 8px rgba(255, 255, 255, 0.8),
          0 0 16px rgba(255, 79, 141, 0.8),
          0 0 30px rgba(255, 79, 141, 0.7),
          0 0 50px rgba(200, 40, 100, 0.6);
      }
      100% {
        text-shadow:
          0 0 12px rgba(255, 255, 255, 1),
          0 0 24px rgba(255, 79, 141, 1),
          0 0 45px rgba(255, 79, 141, 1),
          0 0 70px rgba(200, 40, 100, 0.95);
      }
    }

    .character-wrapper {
      position: relative;
      z-index: 10;
      cursor: pointer;
      transition: transform 0.25s ease, filter 0.25s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 0;
    }

    .character-wrapper:active {
      transform: scale(0.97);
      filter: brightness(1.05);
    }

    .character {
      width: min(300px, 40vw);
      height: auto;
      display: block;
      pointer-events: none;
      user-select: none;
      border-radius: 15px;
    }

    .stars-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.8);
      animation: twinkle var(--duration) ease-in-out infinite alternate;
      opacity: 0;
    }

    @keyframes twinkle {
      0% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.3; transform: scale(0.8); }
    }

    .bg-shape {
      position: absolute;
      border-radius: 999px;
      opacity: 0.28;
      filter: blur(1px);
      animation: float 9s infinite ease-in-out;
      pointer-events: none;
      transform: translateY(30px);
      z-index: 2;
    }

    .bg-heart {
      background: radial-gradient(circle at 30% 30%, #ff9ac0 0%, #ffb3d1 40%, transparent 72%);
    }

    .bg-star {
      background: radial-gradient(circle at 50% 50%, #fff7c2 0%, #ffe7a8 35%, transparent 75%);
    }

    .bg-heart.h1 { width: 240px; height: 170px; top: 8%; left: 6%; animation-delay: 0s; }
    .bg-heart.h2 { width: 180px; height: 130px; bottom: 10%; right: 8%; animation-delay: 2s; }
    .bg-heart.h3 { width: 140px; height: 100px; top: 68%; left: 12%; animation-delay: 4s; }
    .bg-star.s1 { width: 180px; height: 180px; top: 12%; right: 12%; animation-delay: 1s; }
    .bg-star.s2 { width: 130px; height: 130px; bottom: 16%; left: 8%; animation-delay: 3s; }
    .bg-star.s3 { width: 110px; height: 110px; top: 52%; right: 6%; animation-delay: 5s; }

    @keyframes float {
      0%, 100% { transform: translateY(30px) translateX(0px) scale(1); }
      50% { transform: translateY(18px) translateX(6px) scale(1.03); }
    }

    .particle {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      z-index: 12;
      transform-origin: center;
    }

    .particle.star {
      width: 16px;
      height: 16px;
      background: radial-gradient(circle, #fffde7 0%, #fff1a8 45%, rgba(255,241,168,0) 75%);
      filter: drop-shadow(0 0 8px rgba(255, 240, 180, 0.95));
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 92%, 50% 72%, 21% 92%, 32% 57%, 2% 35%, 39% 35%);
    }

    .particle.heart {
      width: 16px;
      height: 16px;
      background: #ff6fa6;
      clip-path: polygon(50% 88%, 8% 48%, 8% 20%, 27% 5%, 50% 18%, 73% 5%, 92% 20%, 92% 48%);
      transform: rotate(45deg);
      filter: drop-shadow(0 0 8px rgba(255, 111, 166, 0.85));
    }

    .particle.sparkle {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 10px rgba(255,255,255,0.95);
    }

    @keyframes burst {
      0% { opacity: 0; transform: translate(0, 0) scale(0.4) rotate(0deg); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.15) rotate(var(--rot)); }
    }

    .message-sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.95);
      opacity: 0;
      pointer-events: none;
      z-index: 19;
      animation: sparkle-pulse 1.4s ease-out forwards;
    }

    @keyframes sparkle-pulse {
      0% { transform: scale(0.4); opacity: 0; }
      20% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.2) translateY(-12px); opacity: 0; }
    }

    @keyframes wave {
      0% { transform: rotate(0deg) translateY(0); }
      20% { transform: rotate(-2deg) translateY(-2px); }
      40% { transform: rotate(2deg) translateY(0); }
      60% { transform: rotate(-1.5deg) translateY(-1px); }
      80% { transform: rotate(1.5deg) translateY(0); }
      100% { transform: rotate(0deg) translateY(0); }
    }

    .character-wrapper.wave {
      animation: wave 0.8s ease-out;
      transform-origin: center bottom;
    }

    #bg-audio {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }

    .loading-indicator {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .loading-indicator.visible { opacity: 1; }

    .debug-info {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: #0f0;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      z-index: 999;
      font-family: monospace;
      max-width: 300px;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .main-frame {
        width: 340px;
        height: 340px;
        padding: 15px;
        border-radius: 25px;
        transform: translateY(5px);
      }
      .hearts-border { border-radius: 28px; }
      .heart-icon { font-size: 12px; }
      .message-image { max-width: 180px; width: 180px; }
      .message-text { font-size: 18px; }
      .character { width: min(180px, 50vw); }
      .sakura-petal { width: 14px; height: 14px; }
      .flowers-corner { width: 160px; }
      .flowers-corner-left { left: -16px; bottom: -16px; }
      .flowers-corner-right { right: -16px; bottom: -16px; }
    }

    @media (min-width: 601px) and (max-width: 1024px) {
      .main-frame {
        width: 500px;
        height: 500px;
        padding: 25px;
        border-radius: 35px;
      }
      .hearts-border { border-radius: 38px; }
      .heart-icon { font-size: 15px; }
      .message-image { max-width: 280px; width: 280px; }
      .message-text { font-size: 26px; }
      .character { width: min(240px, 35vw); }
      .sakura-petal { width: 16px; height: 16px; }
      .flowers-corner { width: 220px; }
      .flowers-corner-left { left: -24px; bottom: -24px; }
      .flowers-corner-right { right: -24px; bottom: -24px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="vignette"></div>

    <div class="sakura-container" id="sakuraContainer"></div>
    <div class="stars-container" id="starsContainer"></div>

    <div class="bg-shape bg-heart h1"></div>
    <div class="bg-shape bg-heart h2"></div>
    <div class="bg-shape bg-heart h3"></div>
    <div class="bg-shape bg-star s1"></div>
    <div class="bg-shape bg-star s2"></div>
    <div class="bg-shape bg-star s3"></div>

    <div class="main-frame">
      <div class="hearts-border" id="heartsBorder"></div>

      <div class="content-wrapper">
        <!-- ЦВЕТЫ: на 16px ОТ центра и ВНИЗ -->
        <img src="flowers.png" alt="Цветы" class="flowers-corner flowers-corner-left" id="flowersLeft" />
        <img src="flowers.png" alt="Цветы" class="flowers-corner flowers-corner-right" id="flowersRight" />

        <div class="message-container" id="messageContainer">
          <div class="message-wrapper">
            <img src="nadpis.png" alt="С днём рождения!" class="message-image" id="messageImage" />
            <div class="message-text">С днём рождения!</div>
          </div>
        </div>

        <div class="character-wrapper" id="character">
          <img src="file.png" alt="Рафаэль из Love and Deepspace" class="character" />
        </div>
      </div>
    </div>
  </div>

  <div class="loading-indicator" id="loadingIndicator">🎵 Загрузка музыки...</div>
  <div class="debug-info" id="debugInfo">Статус: загрузка...</div>

  <audio id="bg-audio" loop preload="auto" autoplay muted>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <script>
    (function() {
      // ---------- ЛЕПЕСТКИ САКУРЫ ----------
      const sakuraContainer = document.getElementById('sakuraContainer');
      const petalCount = 40;

      for (let i = 0; i < petalCount; i++) {
        const petal = document.createElement('div');
        petal.className = 'sakura-petal';
        
        const startX = Math.random() * 100;
        petal.style.left = startX + '%';
        
        const size = 14 + Math.random() * 16;
        petal.style.width = size + 'px';
        petal.style.height = size + 'px';
        
        const duration = 10 + Math.random() * 15;
        petal.style.animationDuration = duration + 's';
        
        const delay = Math.random() * 20;
        petal.style.animationDelay = delay + 's';
        
        const sway = (Math.random() - 0.5) * 200;
        petal.style.setProperty('--sway', sway + 'px');
        
        const hue = 340 + Math.random() * 20;
        const lightness = 70 + Math.random() * 20;
        petal.style.background = `radial-gradient(ellipse at 30% 30%, hsl(${hue}, 80%, ${lightness + 10}%), hsl(${hue}, 70%, ${lightness}%))`;
        
        if (i % 2 === 0) {
          petal.style.borderRadius = '50% 0 50% 50%';
        } else {
          petal.style.borderRadius = '0 50% 50% 50%';
        }
        
        const rotation = Math.random() * 360;
        petal.style.transform = `rotate(${rotation}deg)`;
        
        sakuraContainer.appendChild(petal);
      }

      // ---------- СЕРДЕЧКИ ----------
      const heartsBorder = document.getElementById('heartsBorder');
      const heartSymbols = ['❤️', '💕', '💗', '💖', '💝'];
      const positions = [];

      const size = 610;
      const offset = 3;
      const step = 40;

      for (let x = offset; x <= size - offset; x += step) {
        positions.push({ x: x, y: offset });
      }
      for (let y = offset + step; y <= size - offset; y += step) {
        positions.push({ x: size - offset, y: y });
      }
      for (let x = size - offset - step; x >= offset; x -= step) {
        positions.push({ x: x, y: size - offset });
      }
      for (let y = size - offset - step; y >= offset + step; y -= step) {
        positions.push({ x: offset, y: y });
      }

      positions.forEach((pos, index) => {
        const heart = document.createElement('div');
        heart.className = 'heart-icon';
        heart.textContent = heartSymbols[index % heartSymbols.length];
        heart.style.left = pos.x + 'px';
        heart.style.top = pos.y + 'px';
        heart.style.animationDelay = (index * 0.07) + 's';
        heart.style.fontSize = (16 + Math.random() * 10) + 'px';
        heartsBorder.appendChild(heart);
      });

      // ---------- ЗВЁЗДЫ ----------
      const starsContainer = document.getElementById('starsContainer');
      for (let i = 0; i < 80; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        const size = 2 + Math.random() * 4;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
        star.style.setProperty('--delay', Math.random() * 5 + 's');
        starsContainer.appendChild(star);
      }

      // ---------- ПРОВЕРКА ЗАГРУЗКИ ЦВЕТОВ ----------
      const flowersLeft = document.getElementById('flowersLeft');
      const flowersRight = document.getElementById('flowersRight');

      flowersLeft.addEventListener('load', function() {
        debugInfo.textContent = '✅ Цветы сдвинуты от центра!';
        debugInfo.style.color = '#0f0';
      });

      flowersLeft.addEventListener('error', function() {
        debugInfo.textContent = '⚠️ flowers.png не найдена';
        debugInfo.style.color = '#ff0';
      });

      // ---------- ЗВУК КОЛОКОЛЬЧИКА ----------
      let bellCtx = null;
      let bellGain = null;

      function initBellContext() {
        try {
          if (!bellCtx) {
            bellCtx = new (window.AudioContext || window.webkitAudioContext)();
            bellGain = bellCtx.createGain();
            bellGain.gain.value = 1;
            bellGain.connect(bellCtx.destination);
          }
          if (bellCtx.state === 'suspended') {
            bellCtx.resume();
          }
          return true;
        } catch(e) {
          return false;
        }
      }

      function playBell() {
        if (!initBellContext()) return;

        try {
          const now = bellCtx.currentTime;
          
          const osc1 = bellCtx.createOscillator();
          const gain1 = bellCtx.createGain();
          osc1.type = 'sine';
          osc1.frequency.value = 1200;
          gain1.gain.setValueAtTime(0.12, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc1.connect(gain1);
          gain1.connect(bellGain);
          osc1.start(now);
          osc1.stop(now + 0.5);

          const osc2 = bellCtx.createOscillator();
          const gain2 = bellCtx.createGain();
          osc2.type = 'sine';
          osc2.frequency.value = 1500;
          gain2.gain.setValueAtTime(0.08, now);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc2.connect(gain2);
          gain2.connect(bellGain);
          osc2.start(now);
          osc2.stop(now + 0.4);

          const osc3 = bellCtx.createOscillator();
          const gain3 = bellCtx.createGain();
          osc3.type = 'sine';
          osc3.frequency.value = 1800;
          gain3.gain.setValueAtTime(0.06, now);
          gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc3.connect(gain3);
          gain3.connect(bellGain);
          osc3.start(now);
          osc3.stop(now + 0.3);

        } catch(e) {
          bellCtx = null;
          bellGain = null;
        }
      }

      // ---------- ОСНОВНАЯ ЛОГИКА ----------
      const character = document.getElementById("character");
      const messageContainer = document.getElementById("messageContainer");
      const messageImage = document.getElementById("messageImage");
      const card = document.querySelector(".card");
      const bgAudio = document.getElementById("bg-audio");
      const loadingIndicator = document.getElementById("loadingIndicator");
      const debugInfo = document.getElementById("debugInfo");
      let messageTimer = null;
      let audioStarted = false;
      let musicReady = false;

      messageImage.addEventListener('load', function() {
        if (debugInfo.textContent.includes('Цветы')) return;
        debugInfo.textContent = '✅ Всё готово!';
        debugInfo.style.color = '#0f0';
      });

      messageImage.addEventListener('error', function() {
        debugInfo.textContent = '❌ Ошибка: nadpis.png не найдена!';
        debugInfo.style.color = '#f00';
      });

      loadingIndicator.classList.add('visible');

      function tryAutoPlayMusic() {
        bgAudio.volume = 0.15;
        bgAudio.muted = true;
        bgAudio.play().then(() => {
          setTimeout(() => {
            bgAudio.muted = false;
            audioStarted = true;
            musicReady = true;
            loadingIndicator.textContent = '🎵 Музыка играет';
            loadingIndicator.style.background = 'rgba(0,200,0,0.8)';
            setTimeout(() => {
              loadingIndicator.classList.remove('visible');
            }, 2000);
          }, 500);
        }).catch(() => {
          loadingIndicator.textContent = '🎵 Нажмите на картинку';
          loadingIndicator.style.background = 'rgba(255,150,0,0.8)';
          setTimeout(() => {
            loadingIndicator.classList.remove('visible');
          }, 3000);
          musicReady = false;
        });
      }

      window.addEventListener('load', function() {
        setTimeout(tryAutoPlayMusic, 100);
      });

      function startAudioOnClick() {
        if (!audioStarted && !musicReady) {
          bgAudio.muted = false;
          bgAudio.volume = 0.15;
          bgAudio.play().catch(() => {});
          audioStarted = true;
          musicReady = true;
        }
        initBellContext();
      }

      function createParticle(type, x, y, dx, dy, rot, size, duration) {
        const p = document.createElement("div");
        p.className = `particle ${type}`;
        p.style.left = x + "px";
        p.style.top = y + "px";
        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.setProperty("--dx", dx + "px");
        p.style.setProperty("--dy", dy + "px");
        p.style.setProperty("--rot", rot + "deg");
        p.style.animation = `burst ${duration}ms ease-out forwards`;
        card.appendChild(p);
        setTimeout(() => p.remove(), duration);
      }

      function createMessageSparkles() {
        const rect = messageContainer.getBoundingClientRect();
        const cardRect = card.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2 - cardRect.left;
        const centerY = rect.top + rect.height / 2 - cardRect.top;
        const count = 20;
        const radius = Math.max(rect.width, rect.height) * 0.6;

        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
          const dist = radius + (Math.random() - 0.5) * 30;
          const x = centerX + Math.cos(angle) * dist;
          const y = centerY + Math.sin(angle) * dist;
          const s = document.createElement("div");
          s.className = "message-sparkle";
          s.style.left = x + "px";
          s.style.top = y + "px";
          card.appendChild(s);
          setTimeout(() => s.remove(), 1400);
        }
      }

      function showMessage() {
        messageContainer.classList.add("visible");
        createMessageSparkles();

        clearTimeout(messageTimer);
        messageTimer = setTimeout(() => {
          messageContainer.classList.remove("visible");
        }, 2800);
      }

      function triggerEffect(e) {
        e.preventDefault();
        
        if (!musicReady) {
          startAudioOnClick();
        }
        
        playBell();

        const rect = character.getBoundingClientRect();
        const cardRect = card.getBoundingClientRect();

        const centerX = rect.left + rect.width / 2 - cardRect.left;
        const centerY = rect.top + rect.height / 2 - cardRect.top;

        const radius = Math.max(rect.width, rect.height) * 0.65;
        const count = 30;

        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.35;
          const dist = radius + Math.random() * 80;
          const x = centerX + Math.cos(angle) * (rect.width * 0.5);
          const y = centerY + Math.sin(angle) * (rect.height * 0.5) * 0.8;
          const dx = Math.cos(angle) * dist;
          const dy = Math.sin(angle) * dist;
          const rot = (Math.random() * 360) - 180;
          const size = 8 + Math.random() * 12;
          const duration = 900 + Math.random() * 500;
          const type = i % 3 === 0 ? "heart" : (i % 3 === 1 ? "star" : "sparkle");
          createParticle(type, x, y, dx, dy, rot, size, duration);
        }

        showMessage();

        character.classList.remove("wave");
        void character.offsetWidth;
        character.classList.add("wave");
      }

      character.addEventListener("click", triggerEffect);
      character.addEventListener("touchend", (e) => {
        e.preventDefault();
        triggerEffect(e);
      });

      document.addEventListener('click', function resumeAudio() {
        if (!musicReady) {
          startAudioOnClick();
        }
      }, { once: true });

    })();
  </script>
</body>
</html>
